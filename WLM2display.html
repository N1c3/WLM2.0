<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <title>Wiener Linien Monitor 2.0 - Abfahrten</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 14px;
            min-height: 100vh;
            position: relative;
        }
        .logo {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 72px;
            height: auto;
            z-index: 10;
        }
        h1 {
            color: white;
            margin-bottom: 4px;
            font-size: 20px;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 16px;
        }
        a.back-link {
            color: #00ff00;
            text-decoration: none;
            font-size: 16px;
        }
        a.back-link:hover {
            text-decoration: underline;
        }

        .toolbar {
            margin-bottom: 14px;
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            padding: 6px 12px;
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #555555;
        }
        button.danger {
            border-color: #ff4444;
            color: #ff4444;
        }
        button.danger:hover {
            background-color: #550000;
        }
        #last-update {
            color: #888888;
            font-size: 13px;
            margin-left: auto;
        }

        #empty-msg {
            color: #aaaaaa;
            font-style: italic;
            margin-top: 28px;
            font-size: 16px;
        }

        .station-card {
            border: 1px solid #ffffff;
            border-radius: 5px;
            padding: 14px;
            margin-bottom: 12px;
            background-color: #1a1a1a;
        }
        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }
        .station-name {
            font-size: 17px;
            font-weight: bold;
            color: #ffffff;
        }
        .station-id {
            color: #aaaaaa;
            font-size: 13px;
        }
        .station-remove {
            background: none;
            border: none;
            color: #ff4444;
            font-size: 17px;
            cursor: pointer;
            padding: 0 2px;
        }
        .station-remove:hover {
            color: #ff8888;
        }
        .station-loading {
            color: #aaaaaa;
            font-size: 13px;
        }
        .station-error {
            color: #ff4444;
            font-size: 13px;
        }

        .line-block {
            border-top: 1px solid #333333;
            padding-top: 8px;
            margin-top: 8px;
        }
        .line-block:first-of-type {
            border-top: none;
            margin-top: 0;
            padding-top: 0;
        }
        .line-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .line-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .line-name {
            font-weight: bold;
            font-size: 16px;
            color: #00ff00;
        }
        .line-direction {
            color: #aaaaaa;
            font-size: 14px;
        }
        .line-type {
            color: #888888;
            font-size: 12px;
            text-transform: uppercase;
        }

        .departures-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .departure-badge {
            background: #333333;
            border-radius: 2px;
            padding: 5px 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .departure-min {
            font-weight: bold;
            color: #ffffff;
        }
        .departure-time {
            color: #aaaaaa;
            font-size: 13px;
        }
        .departure-realtime {
            color: #00ff00;
            font-size: 12px;
        }
        .no-departures {
            color: #888888;
            font-style: italic;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <img src="Logo.png?v=3" alt="Logo" class="logo" decoding="async">
    <h1>Wiener Linien Monitor 2.0</h1>
    <p class="subtitle">Departures</p>

    <div class="toolbar">
        <a href="WLM2config.html" class="back-link">&larr; Back to Configuration</a>
        <button onclick="refreshAll()">Refresh Now</button>
        <button class="danger" onclick="deleteAll()">Delete All</button>
        <span id="last-update"></span>
    </div>

    <div id="container"></div>

    <script>
        const REFRESH_MS = 30000;
        let refreshTimer = null;

        function loadData() {
            return JSON.parse(localStorage.getItem('wlm2_stations')) || [];
        }

        function saveData(data) {
            localStorage.setItem('wlm2_stations', JSON.stringify(data));
        }

        function removeStation(stationId) {
            let data = loadData();
            data = data.filter(s => s.stationId !== stationId);
            saveData(data);
            render();
        }

        function deleteAll() {
            if (confirm('Really delete all saved stations and lines?')) {
                localStorage.removeItem('wlm2_stations');
                render();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d)) return '';
            return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        function minutesUntil(dateStr) {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            if (isNaN(d)) return null;
            const diff = Math.round((d - Date.now()) / 60000);
            return diff;
        }

        async function loadDepartures(stationId) {
            const url = `proxy.php?diva=${encodeURIComponent(stationId)}&activateTrafficInfo=stoerungkurz`;
            const response = await fetch(url);
            const rawText = await response.text();
            let data;
            try {
                data = JSON.parse(rawText);
            } catch (e) {
                throw new Error('Invalid JSON from proxy');
            }
            if (data?.error) throw new Error(data.error);
            if (data?.message?.messageCode && data.message.messageCode !== 1) {
                throw new Error(data.message.value || 'API error');
            }
            return data?.data?.monitors || [];
        }

        function extractDepartures(monitors, selectedLines) {
            const result = [];
            const seen = new Set();

            (monitors || []).forEach(monitor => {
                (monitor?.lines || []).forEach(line => {
                    const name = line.name;
                    const direction = line.towards;
                    const key = name + '|' + direction;

                    const isSelected = selectedLines.some(
                        sel => sel.name === name && sel.direction === direction
                    );
                    if (!isSelected) return;
                    if (seen.has(key)) return;
                    seen.add(key);

                    const departures = [];
                    (line.departures?.departure || []).forEach(dep => {
                        const countdown = dep.departureTime?.countdown;
                        const timePlanned = dep.departureTime?.timePlanned;
                        const timeReal = dep.departureTime?.timeReal;

                        let cd = null;
                        if (countdown !== undefined && countdown !== null) {
                            cd = Number(countdown);
                        }
                        if (cd === null || isNaN(cd)) {
                            if (timePlanned || timeReal) {
                                cd = minutesUntil(timeReal || timePlanned);
                            }
                        }
                        if (cd !== null && !isNaN(cd) && cd <= 30) {
                            departures.push({
                                countdown: cd,
                                time: formatTime(timeReal || timePlanned),
                                isRealtime: !!timeReal
                            });
                        }
                    });

                    result.push({
                        name,
                        direction,
                        type: line.type,
                        departures
                    });
                });
            });

            return result;
        }

        function stationHeaderHtml(station) {
            return `
                <div class="station-header">
                    <div>
                        <div class="station-name">${escapeHtml(station.stationName)}</div>
                        <div class="station-id">DIVA-ID: ${escapeHtml(station.stationId)}</div>
                    </div>
                    <button class="station-remove" title="Remove station" onclick="removeStation('${escapeHtml(station.stationId)}')">&times;</button>
                </div>
            `;
        }

        async function refreshAll() {
            const data = loadData();
            const container = document.getElementById('container');

            if (data.length === 0) {
                container.innerHTML = '<p id="empty-msg">No stations selected. Go to configuration and select stations and lines.</p>';
                document.getElementById('last-update').textContent = '';
                return;
            }

            container.innerHTML = '';
            data.forEach(station => {
                const card = document.createElement('div');
                card.className = 'station-card';
                card.id = 'card-' + station.stationId;
                card.innerHTML = stationHeaderHtml(station) + '<div class="station-loading">Loading departures...</div>';
                container.appendChild(card);
            });

            await Promise.all(data.map(async station => {
                const card = document.getElementById('card-' + station.stationId);
                if (!card) return;

                try {
                    const monitors = await loadDepartures(station.stationId);
                    const linesData = extractDepartures(monitors, station.lines || []);

                    let html = stationHeaderHtml(station);

                    if (linesData.length === 0) {
                        html += '<div class="no-departures">No departures found for the selected lines.</div>';
                    } else {
                        linesData.forEach(line => {
                            html += `<div class="line-block">
                                <div class="line-header">
                                    <div class="line-badge">
                                        <span class="line-name">${escapeHtml(line.name)}</span>
                                        <span class="line-direction">&rarr; ${escapeHtml(line.direction)}</span>
                                    </div>
                                    <span class="line-type">${escapeHtml(line.type || '')}</span>
                                </div>
                                <div class="departures-row">
                            `;
                            if (line.departures.length === 0) {
                                html += '<span class="no-departures">No departures</span>';
                            } else {
                                line.departures.forEach(dep => {
                                    html += `<div class="departure-badge">
                                        <span class="departure-min">${dep.countdown} min</span>
                                        ${dep.time ? `<span class="departure-time">(${dep.time})</span>` : ''}
                                        ${dep.isRealtime ? '<span class="departure-realtime">live</span>' : ''}
                                    </div>`;
                                });
                            }
                            html += '</div></div>';
                        });
                    }

                    card.innerHTML = html;
                } catch (err) {
                    card.innerHTML = stationHeaderHtml(station) + `<div class="station-error">Error: ${escapeHtml(err.message)}</div>`;
                }
            }));

            const now = new Date();
            document.getElementById('last-update').textContent = 'Updated: ' + now.toLocaleTimeString('en-US');
        }

        function render() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshAll();
            refreshTimer = setInterval(refreshAll, REFRESH_MS);
        }

        render();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered:', reg.scope))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
