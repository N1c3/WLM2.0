<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <title>Wiener Linien Monitor 2.0</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            position: relative;
            min-height: 100vh;
        }
        h1 {
            color: white;
        }
        .logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: auto;
            z-index: 10;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #ffffff;
        }
        select {
            padding: 10px;
            font-size: 16px;
            width: 400px;
            border: 1px solid #ffffff;
            border-radius: 4px;
            background-color: #000000;
            color: #ffffff;
        }
        select option {
            background-color: #333333;
            color: #ffffff;
        }
        #station-search {
            padding: 10px;
            font-size: 16px;
            width: 400px;
            border: 1px solid #ffffff;
            border-radius: 4px;
            background-color: #000000;
            color: #ffffff;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        #station-search::placeholder {
            color: #888888;
        }
        #station-search:disabled {
            background-color: #222222;
            color: #666666;
        }
        #status {
            margin-top: 10px;
            color: #00ff00;
        }
        button {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555555;
        }
        .select-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #btn-select {
            margin-top: 0;
            height: 42px;
        }

        /* Modal */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        #modal-overlay.active {
            display: flex;
        }
        #modal-box {
            background: #1a1a1a;
            border: 1px solid #ffffff;
            border-radius: 8px;
            padding: 30px;
            min-width: 320px;
            max-width: 500px;
            width: 90%;
            position: relative;
        }
        #modal-box h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 18px;
        }
        #modal-box .station-id-label {
            color: #aaaaaa;
            font-size: 13px;
            margin-bottom: 16px;
        }
        #modal-lines-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #modal-lines-list li {
            padding: 8px 12px;
            margin-bottom: 6px;
            background: #333333;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #modal-lines-list li .line-name {
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            flex: 1;
        }
        #modal-lines-list li .line-direction {
            color: #aaaaaa;
            font-size: 13px;
            text-align: right;
            max-width: 200px;
            flex: 1;
        }
        #modal-lines-list li input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-left: 12px;
            accent-color: #00ff00;
        }
        #modal-loading {
            color: #aaaaaa;
            text-align: center;
            padding: 20px 0;
        }
        #modal-error {
            color: #ff4444;
            display: none;
        }
        #modal-close {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: #333333;
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #modal-close:hover {
            background: #555555;
        }
    </style>
</head>
<body>
    <img src="Logo.png?v=2" alt="Logo" class="logo" decoding="async">
    <h1>Wiener Linien Monitor 2.0</h1>
    <p>Configuration Page</p>
    <p><a href="WLM2display.html" style="color:#00ff00;">To Selection Overview &rarr;</a></p>

    <label for="stationen">Stationen (DIVA-ID):</label>
    <input type="text" id="station-search" placeholder="Search station..." disabled>
    <div class="select-row">
        <select id="stationen" name="stationen" disabled>
            <option value="">Loading stations...</option>
        </select>
        <button id="btn-select" onclick="confirmSelection()">Select</button>
    </div>
    <div id="status"></div>

    <!-- Modal Popup -->
    <div id="modal-overlay">
        <div id="modal-box">
            <h2 id="modal-title">Lines at Station</h2>
            <div class="station-id-label" id="modal-station-label"></div>
            <div id="modal-loading">Loading lines...</div>
            <div id="modal-error"></div>
            <ul id="modal-lines-list"></ul>
            <button id="modal-close" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        let selectedStationId = null;
        let selectedLines = [];
        let savedStations = JSON.parse(localStorage.getItem('wlm2_stations')) || [];
        const stationCache = {};
        let stationOptions = [];

        async function loadStations() {
            const select = document.getElementById('stationen');
            const search = document.getElementById('station-search');
            const status = document.getElementById('status');
            status.textContent = 'Loading data...';
            select.disabled = true;
            search.disabled = true;

            try {
                const haltestellen = await fetch('https://data.wien.gv.at/csv/wienerlinien-ogd-haltestellen.csv').then(r => r.text());
                const rows = haltestellen.split('\n').slice(1);
                stationOptions = [{value: '', text: 'All stations loaded (' + rows.length + ')'}];

                rows.forEach(row => {
                    if (row.trim()) {
                        const columns = row.split(';');
                        if (columns.length >= 4) {
                            const divaId = columns[2].trim().replace(/"/g, '');
                            const name   = columns[3].trim().replace(/"/g, '');
                            stationOptions.push({value: divaId, text: name + ' (' + divaId + ')'});
                        }
                    }
                });

                select.innerHTML = stationOptions.map(o => `<option value="${o.value}">${o.text}</option>`).join('');
                select.disabled = false;
                search.disabled = false;
                status.textContent = 'Loaded! Select a station.';
                status.style.color = '#00ff00';
            } catch (error) {
                status.textContent = 'Error loading: ' + error.message;
                status.style.color = '#ff0000';
            }
        }

        function filterStations(term) {
            const select = document.getElementById('stationen');
            const status = document.getElementById('status');
            const q = term.trim().toLowerCase();

            if (!q) {
                select.innerHTML = stationOptions.map(o => `<option value="${o.value}">${o.text}</option>`).join('');
                status.textContent = stationOptions.length + ' stations loaded.';
                status.style.color = '#00ff00';
                return;
            }

            const filtered = stationOptions.filter(o => o.text.toLowerCase().includes(q));
            select.innerHTML = filtered.map(o => `<option value="${o.value}">${o.text}</option>`).join('');
            status.textContent = filtered.length + ' stations found.';
            status.style.color = '#00ff00';
        }

        function confirmSelection() {
            const select = document.getElementById('stationen');
            const status = document.getElementById('status');
            const selectedId = select.value;

            if (selectedId) {
                selectedStationId = selectedId;
                const selectedName = select.options[select.selectedIndex].text;
                status.textContent = 'Selected: ' + selectedName;
                status.style.color = '#00ff00';
                console.log('selectedStationId:', selectedStationId);
                showStationPopup();
            } else {
                status.textContent = 'Please select a station first.';
                status.style.color = '#ff9900';
            }
        }

        async function showStationPopup() {
            const select = document.getElementById('stationen');
            const stationName = select.options[select.selectedIndex].text;

            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById('modal-title').textContent = stationName.split(' (')[0];
            document.getElementById('modal-station-label').textContent = 'DIVA-ID: ' + selectedStationId;
            document.getElementById('modal-loading').style.display = 'block';
            document.getElementById('modal-error').style.display = 'none';
            document.getElementById('modal-lines-list').innerHTML = '';

            try {
                const url = `proxy.php?diva=${selectedStationId}&activateTrafficInfo=stoerungkurz`;
                console.log('Proxy URL:', url);

                const response = await fetch(url);
                const rawText = await response.text();
                console.log('RAW response:', rawText.substring(0, 1000));

                let data;
                try {
                    data = JSON.parse(rawText);
                } catch (e) {
                    document.getElementById('modal-loading').style.display = 'none';
                    document.getElementById('modal-error').textContent = 'Invalid JSON from proxy: ' + e.message;
                    document.getElementById('modal-error').style.display = 'block';
                    return;
                }
                console.log('Parsed data:', data);

                if (data?.error) {
                    document.getElementById('modal-loading').style.display = 'none';
                    document.getElementById('modal-error').textContent = 'Proxy/API error: ' + data.error;
                    document.getElementById('modal-error').style.display = 'block';
                    return;
                }

                if (data?.message?.messageCode && data.message.messageCode !== 1) {
                    document.getElementById('modal-loading').style.display = 'none';
                    document.getElementById('modal-error').textContent = 'API error: ' + (data.message.value || 'Unknown error');
                    document.getElementById('modal-error').style.display = 'block';
                    return;
                }

                document.getElementById('modal-loading').style.display = 'none';

                const monitors = data?.data?.monitors;
                console.log('Monitors:', monitors);
                if (!monitors || monitors.length === 0) {
                    document.getElementById('modal-error').textContent = 'No lines returned from API (monitors empty). DIVA=' + selectedStationId;
                    document.getElementById('modal-error').style.display = 'block';
                    return;
                }

                const linesMap = new Map();
                monitors.forEach(monitor => {
                    (monitor?.lines || []).forEach(line => {
                        const key = line.name + '|' + line.towards;
                        if (!linesMap.has(key)) {
                            linesMap.set(key, {
                                name: line.name,
                                direction: line.towards,
                                type: line.type
                            });
                        }
                    });
                });

                if (linesMap.size === 0) {
                    document.getElementById('modal-error').textContent = 'No active lines found (outside operating hours?).';
                    document.getElementById('modal-error').style.display = 'block';
                    return;
                }

                const list = document.getElementById('modal-lines-list');
                linesMap.forEach(line => {
                    const li = document.createElement('li');
                    const key = line.name + '|' + line.direction;
                    const isChecked = selectedLines.some(sel => sel.name === line.name && sel.direction === line.direction);
                    li.innerHTML = `
                        <span class="line-name">${line.name}</span>
                        <span class="line-direction">&rarr; ${line.direction}</span>
                        <input type="checkbox" data-line="${line.name}" data-direction="${line.direction}" ${isChecked ? 'checked' : ''}>
                    `;
                    list.appendChild(li);
                });

                list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const lineName = this.getAttribute('data-line');
                        const direction = this.getAttribute('data-direction');
                        if (this.checked) {
                            if (!selectedLines.some(sel => sel.name === lineName && sel.direction === direction)) {
                                selectedLines.push({ name: lineName, direction: direction });
                            }
                        } else {
                            selectedLines = selectedLines.filter(sel => !(sel.name === lineName && sel.direction === direction));
                        }
                        console.log('selectedLines:', selectedLines);
                    });
                });

            } catch (error) {
                document.getElementById('modal-loading').style.display = 'none';
                document.getElementById('modal-error').textContent = 'Error loading API: ' + error.message;
                document.getElementById('modal-error').style.display = 'block';
            }
        }

        function saveStation() {
            if (!selectedStationId || selectedLines.length === 0) return;
            const select = document.getElementById('stationen');
            const stationName = select.options[select.selectedIndex].text.split(' (')[0];

            savedStations = savedStations.filter(s => s.stationId !== selectedStationId);

            savedStations.push({
                stationId: selectedStationId,
                stationName: stationName,
                lines: [...selectedLines]
            });

            localStorage.setItem('wlm2_stations', JSON.stringify(savedStations));
            console.log('Saved stations:', savedStations);
        }

        function closeModal() {
            saveStation();
            document.getElementById('modal-overlay').classList.remove('active');
        }

        document.getElementById('modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        loadStations();

        document.getElementById('stationen').addEventListener('change', function() {
            if (this.value) {
                console.log('Selected DIVA-ID: ' + this.value);
            }
        });

        document.getElementById('station-search').addEventListener('input', function() {
            filterStations(this.value);
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered:', reg.scope))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
